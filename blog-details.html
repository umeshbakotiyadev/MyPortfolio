<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Blog Details | Umesh Bakotiya</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="canonical" href="https://umeshbakotiya.dev/blog-details.html" id="canonical-link">
    <meta name="description" content="Read full article on mobile development and architecture.">
    <meta name="author" content="Umesh Bakotiya">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Blog Details | Umesh Bakotiya">
    <meta property="og:description" content="Read full article on mobile development and architecture.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Blog Details | Umesh Bakotiya">
    <meta property="twitter:description" content="Read full article on mobile development and architecture.">
    <meta property="twitter:image" content="">

    <!-- Favicon -->
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom Style -->
    <link rel='stylesheet' type='text/css' media='screen' href='style/main.css'>

    <!-- Schema.org JSON-LD (Article) -->
    <script type="application/ld+json" id="article-schema">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://umeshbakotiya.dev/blog-details.html"
      },
      "author": {
        "@type": "Person",
        "name": "Umesh Bakotiya"
      }
    }
    </script>
</head>

<body>

    <!-- Navbar -->
    <header class="header_wrapper">
        <nav class="navbar navbar-expand-lg fixed-top header-scrolled">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    UMESH<span style="color: var(--accent-color);">.</span>
                </a>
                
                <a href="blog.html" class="btn-outline btn-sm px-3 py-2 ms-auto d-flex align-items-center">
                    <i class="fas fa-arrow-left me-2"></i> <span class="d-none d-sm-inline">Back to Blog</span><span class="d-inline d-sm-none">Back</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="main_wrapper">
        <section class="blog-detail-section" style="padding: 140px 0 80px;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-9">
                        <div id="blog-content" data-aos="fade-up">
                            <div class="text-center py-5">
                                <div class="spinner-border text-accent" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center bg-alt">
        <div class="container">
            <h4 class="fw-bold mb-4">UMESH BAKOTIYA<span class="text-accent">.</span></h4>
            <div class="d-flex justify-content-center gap-4 mb-5">
                <a href="https://github.com/umeshbakotiyadev" target="_blank" class="text-dark"><i
                        class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/umesh-bakotiya-07a307290/" target="_blank" class="text-dark"><i
                        class="fab fa-linkedin"></i></a>
                <a href="https://wa.link/zpbch6" target="_blank" class="text-dark"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p class="small text-muted mb-0">© 2024. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script/blog-data.js"></script>
    <script src="script/main.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        if (blogId && typeof BLOG_DATA !== 'undefined') {
            const blog = BLOG_DATA.find(b => b.id === blogId);
            if (blog) {
                // Update SEO
                document.title = `${blog.title} | Umesh Bakotiya`;
                document.querySelector('meta[name="description"]').setAttribute('content', blog.summary);

                // OG & Twitter
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.setAttribute('content', blog.title);

                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogDesc) ogDesc.setAttribute('content', blog.summary);

                const ogImage = document.querySelector('meta[property="og:image"]');
                if (ogImage) ogImage.setAttribute('content', `https://umeshbakotiya.dev/${blog.image}`);

                const ogUrl = document.querySelector('meta[property="og:url"]');
                if (ogUrl) ogUrl.setAttribute('content', window.location.href);

                const twitterTitle = document.querySelector('meta[property="twitter:title"]');
                if (twitterTitle) twitterTitle.setAttribute('content', blog.title);

                const twitterDesc = document.querySelector('meta[property="twitter:description"]');
                if (twitterDesc) twitterDesc.setAttribute('content', blog.summary);

                const twitterImage = document.querySelector('meta[property="twitter:image"]');
                if (twitterImage) twitterImage.setAttribute('content', `https://umeshbakotiya.dev/${blog.image}`);

                const canonicalLink = document.getElementById('canonical-link');
                if (canonicalLink) canonicalLink.setAttribute('href', window.location.href);

                // Update Content
                const content = document.getElementById('blog-content');
                content.innerHTML = `
                    <div class="mb-5 text-center">
                        <span class="badge-custom mb-3">${blog.category}</span>
                        <h1 class="display-4 fw-bold mb-4">${blog.title}</h1>
                        <p class="text-muted">By ${blog.author} • ${blog.date}</p>
                    </div>
                    <img src="${blog.image}" alt="${blog.title}" class="img-fluid rounded-4 mb-5 w-100" style="max-height: 500px; object-fit: cover;" onerror="this.src='img/3.png'">
                    <div class="blog-article-content">
                        ${blog.content}
                    </div>
                `;

                // Update Schema
                const schema = JSON.parse(document.getElementById('article-schema').innerHTML);
                schema.headline = blog.title;
                schema.description = blog.summary;
                schema.image = `https://umeshbakotiya.dev/${blog.image}`;
                schema.datePublished = blog.date;
                schema.dateModified = blog.date;
                schema.url = window.location.href;
                document.getElementById('article-schema').innerHTML = JSON.stringify(schema);

                // Refresh AOS
                if (window.AOS) {
                    AOS.refresh();
                }
            } else {
                document.getElementById('blog-content').innerHTML = '<h2 class="text-center">Blog post not found.</h2>';
            }
        } else if (!blogId) {
            window.location.href = 'blog.html';
        } else {
            document.getElementById('blog-content').innerHTML = '<p class="text-center">Error loading blog data.</p>';
        }
    </script>
</body>

</html>
