<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Redirecting to CV...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">

    <!-- 
      COMMON CV REDIRECT:
      Whenever you update your CV PDF name, only change it in this single file!
    -->
    <meta http-equiv="refresh" content="0; url=Umesh-Bakotiya-CV.pdf">

    <!-- Favicon & Fonts -->
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-body: #ffffff;
            --bg-card: #f8fafc;
            --primary-color: #0f172a;
            --accent-color: #0ea5e9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(14, 165, 233, 0.15);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            margin-bottom: 12px;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .btn-link {
            color: var(--text-muted);
            font-size: 0.88rem;
            text-decoration: none;
        }

        .btn-link:hover {
            color: var(--accent-color);
        }
    </style>

    <script>
        // Centralized CV target: Change here if the PDF file changes
        var targetCV = 'Umesh-Bakotiya-CV.pdf';
        window.location.replace(targetCV);
    </script>
</head>

<body>
    <main class="redirect-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Opening Umesh Bakotiya's CV</h1>
        <p>Redirecting you to the latest CV document. If your browser doesn't redirect automatically, click below:</p>

        <a id="cv-link" href="Umesh-Bakotiya-CV.pdf" class="btn btn-primary">
            <i class="fas fa-file-pdf"></i> Open CV Document
        </a>

        <div>
            <a href="index.html" class="btn-link">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
        </div>
    </main>
</body>

</html>
