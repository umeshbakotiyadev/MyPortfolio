    <!-- Schema.org JSON-LD -->

      "@context": "https://schema.org",

<body data-bs-spy="scroll" data-bs-target=".navbar" data-bs-offset="100">

    <!-- Navbar -->
    <header class="header_wrapper">
        <nav class="navbar navbar-expand-lg fixed-top header-scrolled">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    UMESH<span style="color: var(--accent-color);">.</span>
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <i class="fas fa-bars-staggered"></i>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav menu-navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#projects">Work</a></li>
                        <li class="nav-item"><a class="nav-link active" href="blog.html">Blog</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                        <li class="nav-item">
                            <a href="Umesh-Bakotiya-CV.pdf" target="_blank"
                                class="main-btn btn-sm w-100 w-lg-auto ms-lg-4 px-4 py-2 mt-3 mt-lg-0"
                                style="font-size: 0.85rem;">CV</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main_wrapper">
        <section id="blog-list" style="padding-top: 110px;">
            <div class="container">
                <div class="mb-5" data-aos="fade-down">
                    <h1 class="display-5 fw-bold mb-2">Tech Insights<span class="text-accent">.</span></h1>
                    <p class="text-muted mb-0">Thoughts on mobile engineering and architecture.</p>
                </div>

                <div class="row g-4" id="blog-container">
                    <!-- Blogs will be injected here -->
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-accent" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center bg-alt">
        <div class="container">
            <h4 class="fw-bold mb-4">UMESH BAKOTIYA<span class="text-accent">.</span></h4>
            <div class="d-flex justify-content-center gap-4 mb-5">
                <a href="https://github.com/umeshbakotiyadev" target="_blank" class="text-dark"><i
                        class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/umesh-bakotiya-07a307290/" target="_blank" class="text-dark"><i
                        class="fab fa-linkedin"></i></a>
                <a href="https://wa.link/zpbch6" target="_blank" class="text-dark"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p class="small text-muted mb-0">© 2024. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script/blog-data.js"></script>
    <script src="script/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('blog-container');
            if (container && typeof BLOG_DATA !== 'undefined') {
                container.innerHTML = '';

                if (BLOG_DATA.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No blogs found at the moment.</p></div>';
                } else {
                    BLOG_DATA.forEach((blog, index) => {
                        container.innerHTML += `
                            <div class="col-lg-6" data-aos="fade-up" data-aos-delay="${index * 100}">
                                <article class="studio-card h-100 d-flex flex-column">
                                    <div class="mb-4 overflow-hidden rounded-4">
                                        <img src="${blog.image}" alt="${blog.title}" class="img-fluid w-100" style="aspect-ratio: 16/9; object-fit: cover;" onerror="this.src='img/3.png'">
                                    </div>
                                    <div class="d-flex gap-2 mb-3">
                                        <span class="badge-custom">${blog.category}</span>
                                        <span class="small text-muted align-self-center">${blog.date}</span>
                                    </div>
                                    <h2 class="h3 mb-3">${blog.title}</h2>
                                    <p class="text-muted mb-4">${blog.summary}</p>
                                    <div class="mt-auto">
                                        <a href="blog-details.html?id=${blog.id}" class="text-accent fw-bold d-inline-flex align-items-center">
                                            Read Full Article <i class="fas fa-arrow-right ms-2"></i>
                                        </a>
                                    </div>
                                </article>
                            </div>
                        `;
                    });

                    // Re-initialize or refresh AOS after a tiny delay
                    setTimeout(() => {
                        AOS.init({ duration: 800, once: true });
                        AOS.refresh();
                    }, 100);
                }
            } else if (container) {
                container.innerHTML = '<div class="col-12 text-center py-5"><p class="text-danger">Failed to load blog data.</p></div>';
            }
        });
    </script>
</body>

</html>
